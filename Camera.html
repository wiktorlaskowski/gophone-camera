<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>Camera App</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      background-color: #000;
      overflow: hidden;
      height: 100%;
      width: 100%;
      color: #fff;
      font-family: sans-serif;
    }

    video {
      position: absolute;
      top: 0; left: 0;
      width: 100vw;
      height: 100vh;
      object-fit: cover;
      transform: scaleX(-1);
    }

    .controls {
      position: absolute;
      bottom: 2%;
      width: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    button {
      background: none;
      border: 2px solid #fff;
      color: #fff;
      font-size: 16px;
      padding: 8px 12px;
      border-radius: 10px;
      margin: 0 8px;
    }

    #take-photo {
      width: 70px;
      height: 70px;
      border-radius: 50%;
      border: 4px solid #fff;
      background: rgba(255,255,255,0.1);
    }

    #mode-toggle {
      position: absolute;
      top: 10px;
      left: 10px;
    }

    #switch-camera {
      position: absolute;
      top: 10px;
      right: 10px;
    }

    #recording-indicator {
      position: absolute;
      top: 10px;
      left: 50%;
      transform: translateX(-50%);
      background-color: #f06565;
      color: white;
      font-weight: bold;
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 14px;
      display: none;
    }

    canvas {
      display: none;
    }
  </style>
</head>
<body>
  <video id="camera" autoplay playsinline muted></video>
  <canvas id="canvas"></canvas>

  <div id="recording-indicator">00:00</div>

  <button id="mode-toggle">Mode: Photo</button>
  <button id="switch-camera">Switch</button>

  <div class="controls">
    <button id="take-photo"></button>
  </div>

  <script>
    const video = document.getElementById('camera');
    const canvas = document.getElementById('canvas');
    const takeBtn = document.getElementById('take-photo');
    const switchBtn = document.getElementById('switch-camera');
    const modeBtn = document.getElementById('mode-toggle');
    const recordingIndicator = document.getElementById('recording-indicator');

    let stream = null;
    let currentMode = 'photo';
    let currentDeviceIndex = 0;
    let videoDevices = [];
    let mediaRecorder;
    let recordedChunks = [];
    let recordingStartTime = null;
    let recordingTimer = null;

    function generateTimestampFilename(mode) {
      const now = new Date();
      const pad = (n) => String(n).padStart(2, '0');
      const yyyy = now.getFullYear();
      const mm = pad(now.getMonth() + 1);
      const dd = pad(now.getDate());
      const hh = pad(now.getHours());
      const min = pad(now.getMinutes());
      const ss = pad(now.getSeconds());
      return `${mode}-${yyyy}-${mm}-${dd}-${hh}-${min}-${ss}`;
    }

    function formatDuration(seconds) {
      const hrs = Math.floor(seconds / 3600);
      const mins = Math.floor((seconds % 3600) / 60);
      const secs = seconds % 60;
      const pad = (num) => String(num).padStart(2, '0');
      return hrs > 0
        ? `${pad(hrs)}:${pad(mins)}:${pad(secs)}`
        : `${pad(mins)}:${pad(secs)}`;
    }

    function startRecordingTimer() {
      recordingStartTime = Date.now();
      recordingIndicator.textContent = "00:00";
      recordingIndicator.style.display = 'block';
      recordingTimer = setInterval(() => {
        const elapsedSeconds = Math.floor((Date.now() - recordingStartTime) / 1000);
        recordingIndicator.textContent = formatDuration(elapsedSeconds);
      }, 1000);
    }

    function stopRecordingTimer() {
      clearInterval(recordingTimer);
      recordingIndicator.style.display = 'none';
    }

    async function getVideoDevices() {
      const devices = await navigator.mediaDevices.enumerateDevices();
      videoDevices = devices.filter(device => device.kind === 'videoinput');
    }

    async function startCamera(deviceId = null) {
      if (stream) {
        stream.getTracks().forEach(track => track.stop());
      }

      const constraints = {
        video: deviceId ? { deviceId: { exact: deviceId } } : true,
        audio: true
      };

      try {
        stream = await navigator.mediaDevices.getUserMedia(constraints);
        video.srcObject = stream;
      } catch (err) {
        console.error('Camera access denied or failed.', err);
        alert('Camera access was denied or failed.');
      }
    }

    function takePhoto() {
      const context = canvas.getContext('2d');
      canvas.width = video.videoWidth;
      canvas.height = video.videoHeight;

      context.save();
      context.translate(canvas.width, 0);
      context.scale(-1, 1);
      context.drawImage(video, 0, 0, canvas.width, canvas.height);
      context.restore();

      const imageData = canvas.toDataURL('image/png');
      const a = document.createElement('a');
      a.href = imageData;
      a.download = `${generateTimestampFilename('photo')}.png`;
      a.click();
    }

    function startRecording() {
      recordedChunks = [];
      mediaRecorder = new MediaRecorder(stream);
      mediaRecorder.ondataavailable = (e) => {
        if (e.data.size > 0) recordedChunks.push(e.data);
      };
      mediaRecorder.onstop = () => {
        const blob = new Blob(recordedChunks, { type: 'video/webm' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `${generateTimestampFilename('video')}.webm`;
        a.click();
        URL.revokeObjectURL(url);
      };
      mediaRecorder.start();
      takeBtn.style.borderColor = 'red';
      startRecordingTimer();
    }

    function stopRecording() {
      if (mediaRecorder && mediaRecorder.state !== 'inactive') {
        mediaRecorder.stop();
        takeBtn.style.borderColor = '#fff';
        stopRecordingTimer();
      }
    }

    takeBtn.addEventListener('click', () => {
      if (currentMode === 'photo') {
        takePhoto();
      } else {
        if (!mediaRecorder || mediaRecorder.state === 'inactive') {
          startRecording();
        } else {
          stopRecording();
        }
      }
    });

    modeBtn.addEventListener('click', () => {
      currentMode = currentMode === 'photo' ? 'video' : 'photo';
      modeBtn.textContent = `Mode: ${currentMode.charAt(0).toUpperCase() + currentMode.slice(1)}`;
    });

    switchBtn.addEventListener('click', async () => {
      if (videoDevices.length <= 1) {
        alert('No other camera available.');
        return;
      }
      currentDeviceIndex = (currentDeviceIndex + 1) % videoDevices.length;
      await startCamera(videoDevices[currentDeviceIndex].deviceId);
    });

    (async () => {
      await getVideoDevices();
      if (videoDevices.length === 0) {
        alert('No video input devices found.');
        return;
      }
      await startCamera(videoDevices[currentDeviceIndex].deviceId);
    })();
  </script>
</body>
</html>
